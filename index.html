<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Smart Traffic Management System">

    <title>Smart Traffic Management System</title>

    <!-- CSS Files -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/component.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- JavaScript Files -->
    <script src="js/theme.js" defer></script>
    <script src="js/upload.js" defer></script>
    <script src="js/script.js" defer></script>
    <script src="js/analytics.js" defer></script>

</head>

<body>

    <!-- ========== FULL WIDTH HEADER ========== -->
    <header class="header">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle sidebar">
            ☰
        </button>
        <!-- Project Branding -->
        <div class="header-branding">
            <!-- Traffic Signal Icon -->
            <div class="header-signal">
                <span class="signal-light red"></span>
                <span class="signal-light yellow"></span>
                <span class="signal-light green"></span>
            </div>

            <!-- Project Title -->
            <div class="header-title">
                <h1>
                    Smart <span>Traffic</span> Management System
                </h1>

                <p>
                    AI Powered | Safer Roads | Smoother Journeys
                </p>
            </div>

        </div>

        <!-- Header Information -->
        <div class="header-info">

            <div class="system-status">
                <span class="status-indicator"></span>
                <span>Traffic System Online</span>
            </div>

            <!-- Date and Time -->
            <div class="datetime-container">
                <span id="current-date"></span>
                <span id="current-time"></span>
            </div>

        </div>

    </header>


    <!-- ========== APPLICATION CONTAINER ========== -->
    <div class="app-container">

        <!-- ========== SIDEBAR ========== -->
        <aside class="sidebar" id="sidebar">

            <nav class="sidebar-navigation">

                <a href="#dashboard" class="nav-item active">
                    <span class="nav-icon">▦</span>
                    <span class="nav-text">Dashboard</span>
                </a>

                <a href="traffic-analytics.html" class="nav-item">
                <span class="nav-icon">▥</span>
                <span class="nav-text">Traffic Analytics</span>
                </a>

            </nav>


            <!-- Sidebar Bottom -->
            <div class="sidebar-bottom">

                <!-- Theme Toggle -->
                <div class="sidebar-theme">

                    <span class="theme-label">Theme</span>

                    <label class="theme-switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="theme-slider"></span>
                    </label>

                </div>

                <!-- Sidebar Branding -->
                <div class="sidebar-branding">

                    <img
                        src="assets/images/traffic-logo.png"
                        alt="Smart Traffic Logo"
                    >

                    <div class="branding-text">
                        <h3>Smarter AI</h3>
                        <p>Better Traffic</p>
                    </div>

                </div>

            </div>

        </aside>


        <!-- ========== MAIN CONTENT ========== -->
        <main class="main-content">

            <div class="dashboard-content">

                <!-- Traffic Monitoring -->
                <section
                    class="traffic-monitoring"
                    id="dashboard"
                >

                    <!-- Section Header -->
                    <div class="monitoring-header">

                        <div class="monitoring-title">
                            <h2>Traffic Monitoring</h2>
                            <p>Real-time intelligent traffic surveillance</p>
                        </div>
                        <button type="button" id="stop-monitoring-btn" hidden>
                            Stop
                        </button>
                        <div class="monitoring-status">
                            <span class="status-indicator"></span>
                            <span>Live Monitoring</span>
                        </div>

                    </div>


                    <!-- Unified Monitoring Container -->
                    <div class="monitoring-container">

                        <!-- Top Traffic Signal -->
                        <div class="traffic-signal signal-top-left">
                            <div class="signal-housing">
                                <span class="light red"></span>
                                <span class="light yellow"></span>
                                <span class="light green"></span>
                            </div>
                        </div>

                        <!-- Right Traffic Signal -->
                        <div class="traffic-signal signal-top-right">
                            <div class="signal-housing">
                                <span class="light red"></span>
                                <span class="light yellow"></span>
                                <span class="light green"></span>
                            </div>
                        </div>

                        <!-- Bottom Traffic Signal -->
                        <div class="traffic-signal signal-bottom-left">
                            <div class="signal-housing">
                                <span class="light red"></span>
                                <span class="light yellow"></span>
                                <span class="light green"></span>
                            </div>
                        </div>

                        <!-- Left Traffic Signal -->
                        <div class="traffic-signal signal-bottom-right">
                            <div class="signal-housing">
                                <span class="light red"></span>
                                <span class="light yellow"></span>
                                <span class="light green"></span>
                            </div>
                        </div>

                        <!-- Backend Video Input Section -->
                        <div class="video-input-section" id="video-input-section">

                            <button type="button" id="start-monitoring-btn">
                                Start
                            </button>

                            <p id="monitoring-instruction">
                                Click to start monitoring
                            </p>

                            <video
                                id="backend-video"
                                autoplay
                                muted
                                playsinline
                                hidden>
                            </video>

                        </div>

                    </div>

                </section>
                

            </div>

        </main>

    </div>

</body>

</html>
